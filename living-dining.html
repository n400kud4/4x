<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>nano banana — リビングダイニング</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --card: #1e1e1e;
      --border: #2e2e2e;
      --text: #e4dcd4;
      --muted: #666;
      --accent: #d4a76a;
      --accent2: #e8d87a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Helvetica Neue', 'Hiragino Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent2);
    }

    .logo span { color: var(--muted); font-weight: 400; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .room-size-inputs {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .room-size-inputs input {
      width: 44px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 5px;
      text-align: center;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── Main Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Palette ── */
    .palette {
      width: 148px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .palette-section {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 4px 3px;
    }

    .palette-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 8px;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.1s;
    }
    .palette-item:hover { border-color: var(--accent); }
    .palette-item:active { background: #252525; }

    .p-name {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .p-sub {
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px;
    }

    .p-swatch {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* ── Canvas ── */
    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    #room-svg {
      position: absolute;
      top: 0; left: 0;
      touch-action: none;
      cursor: default;
    }

    /* ── Toolbar overlay ── */
    .toolbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(12,12,12,0.9);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
    }

    .toolbar .btn { font-size: 12px; padding: 5px 10px; }

    /* ── Info panel ── */
    .info-bar {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(22,22,22,0.92);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.8;
      min-width: 120px;
    }
    .info-bar b { color: var(--text); font-weight: 500; }

    /* ── Hint ── */
    .hint {
      position: absolute;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #444;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">nano banana <span>/ リビングダイニング</span></div>
  <div class="header-right">
    <div class="room-size-inputs">
      幅
      <input type="number" id="input-w" value="500" min="200" max="1200" step="10">
      × 奥行
      <input type="number" id="input-d" value="400" min="200" max="1200" step="10">
      cm
    </div>
    <button class="btn" id="btn-clear">クリア</button>
    <button class="btn" id="btn-preset-a">プリセット A</button>
    <button class="btn" id="btn-preset-b">プリセット B</button>
  </div>
</header>

<div class="main">
  <div class="palette" id="palette"></div>
  <div class="canvas-wrap" id="canvas-wrap">
    <svg id="room-svg"></svg>
    <div class="info-bar" id="info-bar">
      <b id="info-name">—</b><br>
      <span id="info-size"></span><br>
      <span id="info-pos"></span>
    </div>
    <div class="hint">クリックで追加 / ドラッグで移動 / ダブルクリックで回転 / Delete で削除</div>
    <div class="toolbar">
      <button class="btn" id="btn-zoom-out">−</button>
      <button class="btn" id="btn-zoom-reset">1:1</button>
      <button class="btn" id="btn-zoom-in">＋</button>
      <button class="btn" id="btn-rotate">↻ 回転</button>
      <button class="btn" id="btn-delete">✕ 削除</button>
    </div>
  </div>
</div>

<script>
// ── Catalog ──────────────────────────────────────────────────────────────────
const CATALOG = [
  // nano banana
  {
    id: 'nano-banana', name: 'nano banana', sub: 'カーブドソファ',
    w: 135, d: 70,
    fill: '#e8d870', stroke: '#b8a840', textFill: '#3a3000',
    shape: 'banana',
  },

  // Bo Concept
  {
    id: 'bc-santiago-sofa', name: 'Santiago', sub: 'Bo Concept ソファ 3P',
    w: 235, d: 95,
    fill: '#c0b09a', stroke: '#8a7060', textFill: '#2a1a0a',
    shape: 'sofa',
  },
  {
    id: 'bc-santiago-chair', name: 'Santiago', sub: 'Bo Concept チェア',
    w: 52, d: 56,
    fill: '#c0b09a', stroke: '#8a7060', textFill: '#2a1a0a',
    shape: 'chair',
  },
  {
    id: 'bc-dining-table', name: 'Dining Table', sub: 'Bo Concept 160×90',
    w: 160, d: 90,
    fill: '#7a6050', stroke: '#5a4030', textFill: '#e8ddd5',
    shape: 'rect',
  },
  {
    id: 'bc-coffee', name: 'Coffee Table', sub: 'Bo Concept 120×60',
    w: 120, d: 60,
    fill: '#6a5545', stroke: '#4a3525', textFill: '#e0d5cc',
    shape: 'rect',
  },
  {
    id: 'bc-tv', name: 'TV ボード', sub: 'Bo Concept 180×45',
    w: 180, d: 45,
    fill: '#3a2e24', stroke: '#1a0e04', textFill: '#c8c0b8',
    shape: 'rect',
  },

  // Luminabella
  {
    id: 'lb-pendant', name: 'ペンダント', sub: 'Luminabella',
    w: 55, d: 55,
    fill: '#f8e890', stroke: '#c8b040', textFill: '#3a2800',
    shape: 'light-pendant',
  },
  {
    id: 'lb-floor', name: 'フロアランプ', sub: 'Luminabella',
    w: 38, d: 38,
    fill: '#f8e890', stroke: '#c8b040', textFill: '#3a2800',
    shape: 'light-floor',
  },

  // Generic
  {
    id: 'rug', name: 'ラグ', sub: '200×150',
    w: 200, d: 150,
    fill: '#ddd4c4', stroke: '#bdb0a0', textFill: '#5a4a3a',
    shape: 'rect', opacity: 0.5, zBase: -1,
  },
  {
    id: 'plant', name: '観葉植物', sub: 'φ 40',
    w: 40, d: 40,
    fill: '#5a8050', stroke: '#3a6030', textFill: '#e0f0e0',
    shape: 'plant',
  },
];

// ── State ────────────────────────────────────────────────────────────────────
let roomW = 500, roomH = 400; // cm
let scale = 1;
let items = [];       // { id, defId, x, y, rot, z }
let selected = null;
let nextId = 1;

const GRID = 10; // cm snap
const MIN_SCALE = 0.4, MAX_SCALE = 3;

// ── SVG helpers ──────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ── Furniture shape builders (in local cm coords, origin = top-left) ──────────
function buildShape(def) {
  const { w, d, fill, stroke, textFill, shape, opacity = 1 } = def;
  const g = svgEl('g', { opacity });

  switch (shape) {
    case 'banana': {
      // Crescent / arc sofa shape (top-down)
      const rx = w / 2, ry = d * 0.42;
      const cx = w / 2, cy = d / 2;
      // Outer arc
      const outerPath = `M ${cx - rx},${cy}
        A ${rx},${ry * 1.1} 0 0 1 ${cx + rx},${cy}
        Q ${cx + rx * 0.85},${cy + ry * 1.6} ${cx},${cy + ry * 1.7}
        Q ${cx - rx * 0.85},${cy + ry * 1.6} ${cx - rx},${cy} Z`;
      g.appendChild(svgEl('path', { d: outerPath, fill, stroke, 'stroke-width': 1.5 }));
      // Back cushion line
      const innerPath = `M ${cx - rx * 0.78},${cy + ry * 0.15}
        Q ${cx},${cy - ry * 0.5} ${cx + rx * 0.78},${cy + ry * 0.15}`;
      g.appendChild(svgEl('path', { d: innerPath, fill: 'none', stroke, 'stroke-width': 1.5, opacity: 0.6 }));
      // Label
      const t = svgEl('text', {
        x: cx, y: cy + ry * 0.9,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: textFill, 'font-size': 8, 'font-weight': '600',
      });
      t.textContent = 'nano banana';
      g.appendChild(t);
      break;
    }

    case 'sofa': {
      // Body
      g.appendChild(svgEl('rect', { x: 0, y: 10, width: w, height: d - 10, rx: 3, fill, stroke, 'stroke-width': 1.2 }));
      // Back
      g.appendChild(svgEl('rect', { x: 0, y: 0, width: w, height: 13, rx: 3, fill: stroke, stroke, 'stroke-width': 1 }));
      // Cushion dividers
      for (let i = 1; i < 3; i++) {
        const x = (w / 3) * i;
        g.appendChild(svgEl('line', { x1: x, y1: 10, x2: x, y2: d, stroke, 'stroke-width': 0.8, opacity: 0.5 }));
      }
      // Armrests
      g.appendChild(svgEl('rect', { x: 0, y: 10, width: 8, height: d - 10, rx: 2, fill: stroke, 'stroke-width': 0 }));
      g.appendChild(svgEl('rect', { x: w - 8, y: 10, width: 8, height: d - 10, rx: 2, fill: stroke, 'stroke-width': 0 }));
      // Label
      const t = svgEl('text', {
        x: w / 2, y: d * 0.58,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: textFill, 'font-size': 8,
      });
      t.textContent = def.name;
      g.appendChild(t);
      break;
    }

    case 'chair': {
      g.appendChild(svgEl('rect', { x: 0, y: 8, width: w, height: d - 8, rx: 3, fill, stroke, 'stroke-width': 1.2 }));
      g.appendChild(svgEl('rect', { x: 0, y: 0, width: w, height: 10, rx: 3, fill: stroke, stroke, 'stroke-width': 1 }));
      const t = svgEl('text', {
        x: w / 2, y: d * 0.58,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: textFill, 'font-size': 7,
      });
      t.textContent = 'S';
      g.appendChild(t);
      break;
    }

    case 'light-pendant': {
      const r = w / 2;
      // Glow halo
      const grad = svgEl('radialGradient', { id: `grad-${def.id}`, cx: '50%', cy: '50%', r: '50%' });
      grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': fill, 'stop-opacity': '0.9' }));
      grad.appendChild(svgEl('stop', { offset: '70%', 'stop-color': fill, 'stop-opacity': '0.3' }));
      grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': fill, 'stop-opacity': '0' }));
      const defs = svgEl('defs', {});
      defs.appendChild(grad);
      g.appendChild(defs);
      g.appendChild(svgEl('circle', { cx: r, cy: r, r: r * 1.6, fill: `url(#grad-${def.id})` }));
      g.appendChild(svgEl('circle', { cx: r, cy: r, r, fill, stroke, 'stroke-width': 1.5 }));
      g.appendChild(svgEl('circle', { cx: r, cy: r, r: r * 0.3, fill: 'white', opacity: 0.8 }));
      const t = svgEl('text', {
        x: r, y: r * 2.4,
        'text-anchor': 'middle', fill: textFill, 'font-size': 7,
      });
      t.textContent = 'LB';
      g.appendChild(t);
      break;
    }

    case 'light-floor': {
      const r = w / 2;
      g.appendChild(svgEl('circle', { cx: r, cy: r, r: r * 1.5, fill, opacity: 0.25 }));
      g.appendChild(svgEl('circle', { cx: r, cy: r, r, fill, stroke, 'stroke-width': 1.5 }));
      g.appendChild(svgEl('circle', { cx: r, cy: r, r: r * 0.25, fill: 'white', opacity: 0.8 }));
      break;
    }

    case 'plant': {
      const r = w / 2;
      g.appendChild(svgEl('circle', { cx: r, cy: r, r, fill, stroke, 'stroke-width': 1.2 }));
      g.appendChild(svgEl('circle', { cx: r * 0.7, cy: r * 0.7, r: r * 0.4, fill: '#7aaa70', 'stroke-width': 0 }));
      g.appendChild(svgEl('circle', { cx: r * 1.3, cy: r * 0.65, r: r * 0.35, fill: '#6a9a60', 'stroke-width': 0 }));
      g.appendChild(svgEl('circle', { cx: r, cy: r * 0.55, r: r * 0.38, fill: '#8aba80', 'stroke-width': 0 }));
      break;
    }

    default: { // rect
      g.appendChild(svgEl('rect', { x: 0, y: 0, width: w, height: d, rx: 2, fill, stroke, 'stroke-width': 1.2 }));
      const t = svgEl('text', {
        x: w / 2, y: d / 2,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: textFill, 'font-size': Math.min(9, d * 0.3, w * 0.15),
      });
      t.textContent = def.name;
      g.appendChild(t);
      // dimension text
      const d2 = svgEl('text', {
        x: w / 2, y: d / 2 + 10,
        'text-anchor': 'middle', 'dominant-baseline': 'middle',
        fill: textFill, 'font-size': 7, opacity: 0.7,
      });
      d2.textContent = `${w}×${d}`;
      g.appendChild(d2);
    }
  }

  return g;
}

// ── Room render ──────────────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
const svg = document.getElementById('room-svg');

let roomGroup, gridGroup, furnitureGroup, defsGroup;

function initSVG() {
  svg.innerHTML = '';

  defsGroup = svgEl('defs', {});
  svg.appendChild(defsGroup);

  roomGroup = svgEl('g', { id: 'room-group' });
  gridGroup = svgEl('g', { id: 'grid-group' });
  furnitureGroup = svgEl('g', { id: 'furniture-group' });

  roomGroup.appendChild(gridGroup);
  roomGroup.appendChild(furnitureGroup);
  svg.appendChild(roomGroup);
}

function updateSVGSize() {
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
}

function applyTransform() {
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  const roomPxW = roomW * scale;
  const roomPxH = roomH * scale;
  const tx = (W - roomPxW) / 2;
  const ty = (H - roomPxH) / 2;
  roomGroup.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

function drawGrid() {
  gridGroup.innerHTML = '';

  // Floor fill
  gridGroup.appendChild(svgEl('rect', {
    x: 0, y: 0, width: roomW, height: roomH,
    fill: '#f4efe8', stroke: 'none',
  }));

  // Grid lines 50cm
  for (let x = 0; x <= roomW; x += 50) {
    const major = (x % 100 === 0);
    gridGroup.appendChild(svgEl('line', {
      x1: x, y1: 0, x2: x, y2: roomH,
      stroke: major ? '#d4c8bc' : '#e4ddd6',
      'stroke-width': major ? 0.8 : 0.4,
    }));
  }
  for (let y = 0; y <= roomH; y += 50) {
    const major = (y % 100 === 0);
    gridGroup.appendChild(svgEl('line', {
      x1: 0, y1: y, x2: roomW, y2: y,
      stroke: major ? '#d4c8bc' : '#e4ddd6',
      'stroke-width': major ? 0.8 : 0.4,
    }));
  }

  // Room outline (walls)
  gridGroup.appendChild(svgEl('rect', {
    x: 0, y: 0, width: roomW, height: roomH,
    fill: 'none', stroke: '#6a5a4a', 'stroke-width': 4,
  }));

  // Scale bar (bottom-right, 100cm)
  const barX = roomW - 120, barY = roomH - 16;
  gridGroup.appendChild(svgEl('line', { x1: barX, y1: barY, x2: barX + 100, y2: barY, stroke: '#9a8a7a', 'stroke-width': 1.5 }));
  gridGroup.appendChild(svgEl('line', { x1: barX, y1: barY - 4, x2: barX, y2: barY + 4, stroke: '#9a8a7a', 'stroke-width': 1.5 }));
  gridGroup.appendChild(svgEl('line', { x1: barX + 100, y1: barY - 4, x2: barX + 100, y2: barY + 4, stroke: '#9a8a7a', 'stroke-width': 1.5 }));
  const bt = svgEl('text', { x: barX + 50, y: barY - 6, 'text-anchor': 'middle', fill: '#9a8a7a', 'font-size': 8 });
  bt.textContent = '1m';
  gridGroup.appendChild(bt);

  // Room dimension label
  const rt = svgEl('text', { x: roomW / 2, y: -8, 'text-anchor': 'middle', fill: '#8a7a6a', 'font-size': 10 });
  rt.textContent = `${(roomW / 100).toFixed(1)}m × ${(roomH / 100).toFixed(1)}m`;
  gridGroup.appendChild(rt);
}

// ── Items render ─────────────────────────────────────────────────────────────
function renderItems() {
  furnitureGroup.innerHTML = '';

  const sorted = [...items].sort((a, b) => {
    const za = getDef(a.defId).zBase ?? 0;
    const zb = getDef(b.defId).zBase ?? 0;
    return za !== zb ? za - zb : a.z - b.z;
  });

  for (const item of sorted) {
    const def = getDef(item.defId);
    if (!def) continue;

    const g = svgEl('g', {
      'data-id': item.id,
      class: 'furniture-item',
      transform: itemTransform(item, def),
      style: 'cursor:grab',
    });

    const shape = buildShape(def);
    g.appendChild(shape);

    // Selection highlight
    if (selected === item.id) {
      g.appendChild(svgEl('rect', {
        x: -2, y: -2,
        width: rotatedW(item, def) + 4,
        height: rotatedD(item, def) + 4,
        rx: 4,
        fill: 'none', stroke: '#d4a76a', 'stroke-width': 1.5,
        'stroke-dasharray': '4 2',
      }));
    }

    furnitureGroup.appendChild(g);
  }
}

function getDef(defId) {
  return CATALOG.find(c => c.id === defId);
}

function itemTransform(item, def) {
  const w = def.w, d = def.d;
  // Rotate around item center
  const cx = w / 2, cy = d / 2;
  return `translate(${item.x},${item.y}) rotate(${item.rot},${cx},${cy})`;
}

function rotatedW(item, def) { return item.rot % 180 === 0 ? def.w : def.d; }
function rotatedD(item, def) { return item.rot % 180 === 0 ? def.d : def.w; }

// ── Palette ──────────────────────────────────────────────────────────────────
function buildPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';

  const sections = [
    { label: 'nano banana', ids: ['nano-banana'] },
    { label: 'Bo Concept', ids: ['bc-santiago-sofa', 'bc-santiago-chair', 'bc-dining-table', 'bc-coffee', 'bc-tv'] },
    { label: 'Luminabella', ids: ['lb-pendant', 'lb-floor'] },
    { label: 'その他', ids: ['rug', 'plant'] },
  ];

  for (const sec of sections) {
    const label = document.createElement('div');
    label.className = 'palette-section';
    label.textContent = sec.label;
    palette.appendChild(label);

    for (const id of sec.ids) {
      const def = CATALOG.find(c => c.id === id);
      if (!def) continue;

      const el = document.createElement('div');
      el.className = 'palette-item';
      el.innerHTML = `
        <div class="p-name">
          <span class="p-swatch" style="background:${def.fill};border:1px solid ${def.stroke}"></span>
          ${def.name}
        </div>
        <div class="p-sub">${def.sub}</div>
      `;
      el.addEventListener('click', () => addItem(def.id));
      el.addEventListener('touchend', (e) => { e.preventDefault(); addItem(def.id); });
      palette.appendChild(el);
    }
  }
}

// ── Add / Select / Move ───────────────────────────────────────────────────────
function addItem(defId) {
  const def = getDef(defId);
  // Place near center with slight jitter
  const jitter = items.length * 12;
  const x = snap(roomW / 2 - def.w / 2 + (jitter % 50));
  const y = snap(roomH / 2 - def.d / 2 + (jitter % 40));
  const item = { id: nextId++, defId, x, y, rot: 0, z: nextId };
  items.push(item);
  selected = item.id;
  redraw();
  updateInfo();
}

function snap(v) {
  return Math.round(v / GRID) * GRID;
}

function selectItem(id) {
  selected = id;
  if (id) {
    const item = items.find(i => i.id === id);
    if (item) item.z = ++nextId;
  }
  renderItems();
  updateInfo();
}

function deleteSelected() {
  if (!selected) return;
  items = items.filter(i => i.id !== selected);
  selected = null;
  renderItems();
  updateInfo();
}

function rotateSelected() {
  if (!selected) return;
  const item = items.find(i => i.id === selected);
  if (!item) return;
  item.rot = (item.rot + 90) % 360;
  renderItems();
  updateInfo();
}

function updateInfo() {
  const nameEl = document.getElementById('info-name');
  const sizeEl = document.getElementById('info-size');
  const posEl = document.getElementById('info-pos');

  if (!selected) {
    nameEl.textContent = '—';
    sizeEl.textContent = '';
    posEl.textContent = '';
    return;
  }

  const item = items.find(i => i.id === selected);
  const def = getDef(item.defId);
  nameEl.textContent = def.name;
  sizeEl.textContent = `${def.w} × ${def.d} cm`;
  posEl.textContent = `X:${item.x}  Y:${item.y}`;
}

// ── Drag handling ─────────────────────────────────────────────────────────────
let dragState = null;

function roomPoint(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  const roomPxW = roomW * scale;
  const roomPxH = roomH * scale;
  const tx = (W - roomPxW) / 2;
  const ty = (H - roomPxH) / 2;
  return { x: (px - tx) / scale, y: (py - ty) / scale };
}

function hitTest(roomX, roomY) {
  // Find topmost item at this point
  for (const item of [...items].sort((a, b) => b.z - a.z)) {
    const def = getDef(item.defId);
    // Simple unrotated hit test (approximate)
    const rw = rotatedW(item, def);
    const rd = rotatedD(item, def);
    // For rotated items, transform point into item local space
    const cx = item.x + def.w / 2;
    const cy = item.y + def.d / 2;
    const rad = -item.rot * Math.PI / 180;
    const lx = (roomX - cx) * Math.cos(rad) - (roomY - cy) * Math.sin(rad) + def.w / 2;
    const ly = (roomX - cx) * Math.sin(rad) + (roomY - cy) * Math.cos(rad) + def.d / 2;
    if (lx >= 0 && lx <= def.w && ly >= 0 && ly <= def.d) {
      return item;
    }
  }
  return null;
}

function getPointer(e) {
  if (e.touches) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

svg.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const { x: cx, y: cy } = getPointer(e);
  const rp = roomPoint(cx, cy);
  const hit = hitTest(rp.x, rp.y);

  if (hit) {
    selectItem(hit.id);
    dragState = {
      itemId: hit.id,
      startRoomX: rp.x,
      startRoomY: rp.y,
      startItemX: hit.x,
      startItemY: hit.y,
    };
  } else {
    selectItem(null);
  }
});

svg.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  e.preventDefault();
  const { x: cx, y: cy } = getPointer(e);
  const rp = roomPoint(cx, cy);
  const dx = rp.x - dragState.startRoomX;
  const dy = rp.y - dragState.startRoomY;
  const item = items.find(i => i.id === dragState.itemId);
  if (!item) return;
  item.x = snap(Math.max(0, Math.min(roomW - getDef(item.defId).w, dragState.startItemX + dx)));
  item.y = snap(Math.max(0, Math.min(roomH - getDef(item.defId).d, dragState.startItemY + dy)));
  renderItems();
  updateInfo();
});

svg.addEventListener('pointerup', () => { dragState = null; });
svg.addEventListener('pointercancel', () => { dragState = null; });

// Double click to rotate
svg.addEventListener('dblclick', (e) => {
  const rp = roomPoint(e.clientX, e.clientY);
  const hit = hitTest(rp.x, rp.y);
  if (hit) {
    selected = hit.id;
    rotateSelected();
  }
});

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if (e.key === 'r' || e.key === 'R') rotateSelected();
  if (e.key === 'Escape') { selected = null; renderItems(); updateInfo(); }
});

// ── Zoom ──────────────────────────────────────────────────────────────────────
function setScale(s) {
  scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, s));
  applyTransform();
}

function fitScale() {
  const W = wrap.clientWidth - 60;
  const H = wrap.clientHeight - 60;
  scale = Math.min(W / roomW, H / roomH);
  applyTransform();
}

document.getElementById('btn-zoom-in').addEventListener('click', () => setScale(scale * 1.25));
document.getElementById('btn-zoom-out').addEventListener('click', () => setScale(scale / 1.25));
document.getElementById('btn-zoom-reset').addEventListener('click', fitScale);
document.getElementById('btn-rotate').addEventListener('click', rotateSelected);
document.getElementById('btn-delete').addEventListener('click', deleteSelected);

// Pinch-to-zoom
let lastPinchDist = null;
svg.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) lastPinchDist = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY,
  );
}, { passive: true });
svg.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY,
    );
    if (lastPinchDist) setScale(scale * (dist / lastPinchDist));
    lastPinchDist = dist;
  }
}, { passive: true });
svg.addEventListener('touchend', () => { lastPinchDist = null; });

// ── Room size ──────────────────────────────────────────────────────────────────
document.getElementById('input-w').addEventListener('change', (e) => {
  roomW = Math.max(200, Math.min(1200, parseInt(e.target.value) || 500));
  redraw();
});
document.getElementById('input-d').addEventListener('change', (e) => {
  roomH = Math.max(200, Math.min(1200, parseInt(e.target.value) || 400));
  redraw();
});

// ── Clear ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('全ての家具をクリアしますか？')) return;
  items = [];
  selected = null;
  redraw();
});

// ── Presets ──────────────────────────────────────────────────────────────────
const PRESETS = {

    { defId: 'bc-dining-table',  x: 220, y: 210, rot: 0 },
    { defId: 'bc-santiago-chair',x: 220, y: 165, rot: 0 },
    { defId: 'bc-santiago-chair',x: 278, y: 165, rot: 0 },
    { defId: 'bc-santiago-chair',x: 220, y: 305, rot: 180 },
    { defId: 'bc-santiago-chair',x: 278, y: 305, rot: 180 },
    { defId: 'lb-pendant',       x: 247, y: 232, rot: 0 },
    { defId: 'lb-floor',         x: 430, y: 40,  rot: 0 },
    { defId: 'bc-tv',            x: 20,  y: 280, rot: 0 },

  ],
  b: [
    // Layout B: ダイニング壁寄り、ソファ中央
    { defId: 'rug',              x: 30,  y: 180, rot: 0 },
    { defId: 'bc-dining-table',  x: 50,  y: 40,  rot: 0 },
    { defId: 'bc-santiago-chair',x: 50,  y: 10,  rot: 0 },
    { defId: 'bc-santiago-chair',x: 108, y: 10,  rot: 0 },
    { defId: 'bc-santiago-chair',x: 50,  y: 135, rot: 180 },
    { defId: 'bc-santiago-chair',x: 108, y: 135, rot: 180 },
    { defId: 'lb-pendant',       x: 102, y: 62,  rot: 0 },
    { defId: 'bc-santiago-sofa', x: 30,  y: 230, rot: 0 },
    { defId: 'nano-banana',      x: 300, y: 260, rot: 90 },
    { defId: 'bc-coffee',        x: 100, y: 340, rot: 0 },
    { defId: 'bc-tv',            x: 290, y: 370, rot: 0 },
    { defId: 'lb-floor',         x: 430, y: 180, rot: 0 },
    { defId: 'plant',            x: 450, y: 30,  rot: 0 },
  ],
};

function loadPreset(key) {
  items = PRESETS[key].map((p, i) => ({
    id: nextId++, defId: p.defId, x: p.x, y: p.y, rot: p.rot, z: i,
  }));
  selected = null;
  redraw();
}

document.getElementById('btn-preset-a').addEventListener('click', () => loadPreset('a'));
document.getElementById('btn-preset-b').addEventListener('click', () => loadPreset('b'));

// ── Redraw ────────────────────────────────────────────────────────────────────
function redraw() {
  drawGrid();
  renderItems();
  applyTransform();
  updateInfo();
}

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  initSVG();
  updateSVGSize();
  buildPalette();
  fitScale();
  loadPreset('a');
}

window.addEventListener('resize', () => {
  updateSVGSize();
  fitScale();
  drawGrid();
  applyTransform();
});

init();
</script>
