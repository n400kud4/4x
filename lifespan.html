<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="残り寿命">
<link rel="manifest" href="lifespan-manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>残り寿命</title>
<style>
:root {
  --bg: #0c0c0c;
  --fg: #e8e6e1;
  --dim: #6a6864;
  --line: #1f1d1a;
  --accent: #d4a76a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  height: 100%;
}
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
}

/* === SETUP === */
#setup {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px 28px;
  gap: 24px;
}
.setup-title {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--dim);
  text-transform: uppercase;
}
.field { width: 100%; max-width: 280px; }
.field-lbl {
  display: block;
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--dim);
  margin-bottom: 8px;
}
.field input[type="date"] {
  background: var(--line);
  border: 1px solid #2a2826;
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  padding: 13px 14px;
  width: 100%;
  outline: none;
  border-radius: 0;
  -webkit-appearance: none;
}
.field input[type="date"]:focus { border-color: var(--accent); }
.gender-wrap { width: 100%; max-width: 280px; }
.gender-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}
.g-btn {
  background: var(--line);
  border: 1px solid #2a2826;
  color: var(--dim);
  font-family: inherit;
  font-size: 13px;
  padding: 13px;
  cursor: pointer;
  transition: color .12s, border-color .12s;
}
.g-btn.on { color: var(--accent); border-color: var(--accent); }
.go-btn {
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.16em;
  padding: 14px;
  cursor: pointer;
  width: 100%;
  max-width: 280px;
  transition: background .12s;
}
.go-btn:hover { background: rgba(212,167,106,.08); }

/* === MAIN === */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* progress bar */
.bar-row {
  padding: 14px 18px 0;
}
.bar-track {
  height: 2px;
  background: var(--line);
}
.bar-fill {
  height: 100%;
  background: var(--accent);
}
.bar-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 7px;
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
}

/* central countdown */
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 18px;
  text-align: center;
  gap: 0;
}
.big-num {
  font-size: clamp(68px, 20vw, 118px);
  font-weight: 200;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.big-unit {
  font-size: 13px;
  color: var(--dim);
  letter-spacing: 0.14em;
  margin-top: 6px;
  margin-bottom: 26px;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0 4px;
  width: 100%;
  max-width: 360px;
}
.d-val {
  font-size: clamp(14px, 4vw, 20px);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.d-unit {
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.1em;
  margin-top: 4px;
}
@keyframes pulse {
  0%   { opacity: 1; }
  50%  { opacity: 0.45; }
  100% { opacity: 1; }
}
.tick { animation: pulse 1s ease-in-out; }

/* bottom bar */
.bottom-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 18px;
  border-top: 1px solid var(--line);
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.06em;
}
.sett-btn {
  background: none;
  border: none;
  color: var(--dim);
  font-size: 15px;
  cursor: pointer;
  padding: 4px 6px;
  line-height: 1;
  transition: color .12s;
  -webkit-tap-highlight-color: transparent;
}
.sett-btn:hover { color: var(--fg); }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <p class="setup-title">残り寿命</p>

  <div class="field">
    <span class="field-lbl">生年月日</span>
    <input type="date" id="dob">
  </div>

  <div class="gender-wrap">
    <span class="field-lbl">性別</span>
    <div class="gender-grid">
      <button class="g-btn" data-g="male">男性</button>
      <button class="g-btn" data-g="female">女性</button>
    </div>
  </div>

  <button class="go-btn" id="goBtn">開始</button>
</div>

<!-- MAIN -->
<div id="main" class="hidden">
  <div class="bar-row">
    <div class="bar-track"><div class="bar-fill" id="fill"></div></div>
    <div class="bar-labels">
      <span id="lPct">—</span>
      <span id="rPct">—</span>
    </div>
  </div>

  <div class="center">
    <div class="big-num" id="bigY">—</div>
    <div class="big-unit">年</div>
    <div class="detail-grid">
      <div>
        <div class="d-val" id="cD">—</div>
        <div class="d-unit">日</div>
      </div>
      <div>
        <div class="d-val" id="cH">—</div>
        <div class="d-unit">時間</div>
      </div>
      <div>
        <div class="d-val" id="cM">—</div>
        <div class="d-unit">分</div>
      </div>
      <div>
        <div class="d-val" id="cS">—</div>
        <div class="d-unit">秒</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <span id="infoL">—</span>
    <button class="sett-btn" id="settBtn" title="設定">⚙</button>
    <span id="infoR">—</span>
  </div>
</div>

<script>
(() => {
  // 厚生労働省 令和5年(2023)簡易生命表
  const EXP = { male: 81.09, female: 87.14 };
  const $ = id => document.getElementById(id);

  let dob = localStorage.getItem('ls_dob');
  let sex = localStorage.getItem('ls_sex');

  $('dob').max = new Date().toISOString().slice(0, 10);
  if (dob) $('dob').value = dob;

  let selSex = sex;
  document.querySelectorAll('.g-btn').forEach(b => {
    if (b.dataset.g === sex) b.classList.add('on');
    b.addEventListener('click', () => {
      document.querySelectorAll('.g-btn').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      selSex = b.dataset.g;
    });
  });

  $('goBtn').addEventListener('click', () => {
    const d = $('dob').value;
    if (!d) { alert('生年月日を入力してください'); return; }
    if (!selSex) { alert('性別を選択してください'); return; }
    localStorage.setItem('ls_dob', d);
    localStorage.setItem('ls_sex', selSex);
    dob = d; sex = selSex;
    launch();
  });

  $('settBtn').addEventListener('click', () => {
    clearInterval(timer);
    $('main').classList.add('hidden');
    $('setup').classList.remove('hidden');
    if (dob) $('dob').value = dob;
    document.querySelectorAll('.g-btn').forEach(b => b.classList.toggle('on', b.dataset.g === sex));
    selSex = sex;
  });

  let timer;
  function launch() {
    $('setup').classList.add('hidden');
    $('main').classList.remove('hidden');

    const birth = new Date(dob + 'T00:00:00');
    const exp = EXP[sex];
    const deathMs = birth.getTime() + exp * 365.25 * 24 * 3600 * 1000;
    const totalMs = deathMs - birth.getTime();
    const gLabel = sex === 'male' ? '男性' : '女性';

    $('infoL').textContent = dob;
    $('infoR').textContent = `平均 ${exp}年（${gLabel}）`;

    const sEl = $('cS');
    let prevSec = -1;

    function tick() {
      const now = Date.now();
      const rem = Math.max(0, deathMs - now);
      const pct = (now - birth.getTime()) / totalMs;

      $('fill').style.width = (pct * 100).toFixed(5) + '%';
      $('lPct').textContent = (pct * 100).toFixed(4) + '% 消費済み';
      $('rPct').textContent = ((1 - pct) * 100).toFixed(4) + '% 残り';

      const s = rem / 1000;
      const years = s / (365.25 * 24 * 3600);
      const days  = Math.floor(s / 86400);
      const hrs   = Math.floor((s % 86400) / 3600);
      const mins  = Math.floor((s % 3600) / 60);
      const secs  = Math.floor(s % 60);

      $('bigY').textContent = years.toFixed(1);
      $('cD').textContent   = days.toLocaleString();
      $('cH').textContent   = String(hrs).padStart(2, '0');
      $('cM').textContent   = String(mins).padStart(2, '0');
      sEl.textContent       = String(secs).padStart(2, '0');

      if (secs !== prevSec) {
        sEl.classList.remove('tick');
        void sEl.offsetWidth;
        sEl.classList.add('tick');
        prevSec = secs;
      }
    }

    clearInterval(timer);
    tick();
    timer = setInterval(tick, 500);
  }

  if (dob && sex) launch();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
