<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4x">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.svg">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<title>4x</title>
<style>
  :root {
    --bg: #0c0c0c;
    --fg: #e8e6e1;
    --dim: #6a6864;
    --line: #1f1d1a;
    --accent: #d4a76a;
    --hover: #15130f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  header h1 b { color: var(--accent); font-weight: 500; }
  header .meta { color: var(--dim); font-size: 11px; letter-spacing: 0.08em; }

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .dropzone {
    margin: 14px 18px;
    padding: 22px 14px;
    border: 1px dashed var(--line);
    text-align: center;
    color: var(--dim);
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    user-select: none;
  }
  .dropzone:hover, .dropzone.over {
    border-color: var(--accent);
    color: var(--fg);
    background: var(--hover);
  }
  .dropzone .plus { font-size: 18px; margin-right: 6px; color: var(--accent); }
  .dropzone input { display: none; }

  .playlist {
    list-style: none;
    padding: 0 0 18px;
  }
  .playlist:empty::before {
    content: "(プレイリストは空です)";
    display: block;
    text-align: center;
    color: var(--dim);
    padding: 8px 0 18px;
    font-size: 12px;
  }
  .row {
    display: grid;
    grid-template-columns: 28px 1fr auto 28px;
    gap: 10px;
    align-items: center;
    padding: 9px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
  }
  .row:hover { background: var(--hover); }
  .row.active { color: var(--accent); }
  .row .idx { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row.active .idx { color: var(--accent); }
  .row .name {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .row .dur {
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .row .x {
    color: var(--dim);
    text-align: center;
    font-size: 16px;
    line-height: 1;
    opacity: 0;
    transition: opacity .12s, color .12s;
  }
  .row:hover .x { opacity: 1; }
  .row .x:hover { color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    background: var(--bg);
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .now {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    gap: 12px;
  }
  .now .title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 13px;
  }
  .now .title.empty { color: var(--dim); }
  .now .time {
    color: var(--dim);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .seek {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: transparent;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .seek::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--line);
    border-radius: 0;
  }
  .seek::-moz-range-track {
    height: 2px;
    background: var(--line);
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -7px;
    border: none;
  }
  .seek::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }
  .btn {
    background: none;
    border: none;
    color: var(--fg);
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    padding: 8px 10px;
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    border-radius: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { color: var(--accent); }
  .btn.play { font-size: 20px; }
  .btn.loop {
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--dim);
    border: 1px solid var(--line);
    padding: 6px 10px;
  }
  .btn.loop.on { color: var(--accent); border-color: var(--accent); }

  .speed {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .speed label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  .speed .val {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    min-width: 38px;
    text-align: right;
    flex-shrink: 0;
  }
  .speed input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 18px;
    background: transparent;
    cursor: pointer;
  }
  .speed input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  .speed input[type="range"]::-moz-range-track { height: 2px; background: var(--line); }
  .speed input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); margin-top: -7px; border: none;
  }
  .speed input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: none;
  }
  .speed .preset {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    font-family: inherit;
    font-size: 11px;
    padding: 4px 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .speed .preset:hover { color: var(--accent); border-color: var(--accent); }

  .pitch {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.04em;
    margin-top: 8px;
  }
  .pitch input { accent-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1><b>4x</b> player</h1>
  <span class="meta" id="counter">0 tracks</span>
</header>

<main>
  <label class="dropzone" id="drop">
    <span class="plus">+</span>タップしてファイルを選択 / ドロップ
    <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus,.mp4" multiple>
  </label>
  <ul class="playlist" id="list"></ul>
</main>

<footer>
  <div class="now">
    <span class="title empty" id="title">— 未選択 —</span>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="controls">
    <div>
      <button class="btn" id="prev" title="前のトラック">⏮</button>
      <button class="btn play" id="play" title="再生/停止">▶</button>
      <button class="btn" id="next" title="次のトラック">⏭</button>
    </div>
    <button class="btn loop" id="loop" title="ループモード">LOOP: OFF</button>
  </div>
  <div class="speed">
    <label>SPEED</label>
    <input type="range" id="rate" min="0.5" max="4" step="0.1" value="4">
    <span class="val" id="rateVal">4.0×</span>
    <button class="preset" data-r="1">1×</button>
    <button class="preset" data-r="2">2×</button>
    <button class="preset" data-r="4">4×</button>
  </div>
  <label class="pitch">
    <input type="checkbox" id="pitch" checked>
    ピッチ保持（音声内容を聞き取りやすく）
  </label>
</footer>

<audio id="audio" preload="metadata"></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const list = $('list');
  const drop = $('drop');
  const fileIn = $('file');

  let tracks = [];   // { id, name, url, file, dur }
  let current = -1;
  let loopMode = 0;  // 0:off, 1:one, 2:all
  const loopLabels = ['OFF', 'ONE', 'ALL'];

  // ---- helpers ----
  const fmt = s => {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const uid = () => Math.random().toString(36).slice(2, 9);

  // ---- playlist render ----
  function render() {
    list.innerHTML = '';
    tracks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'row' + (i === current ? ' active' : '');
      li.innerHTML = `
        <span class="idx">${String(i + 1).padStart(2, '0')}</span>
        <span class="name">${escapeHtml(t.name)}</span>
        <span class="dur">${fmt(t.dur)}</span>
        <span class="x" data-i="${i}" title="削除">×</span>
      `;
      li.addEventListener('click', e => {
        if (e.target.classList.contains('x')) {
          remove(i);
        } else {
          play(i);
        }
      });
      list.appendChild(li);
    });
    $('counter').textContent = `${tracks.length} track${tracks.length === 1 ? '' : 's'}`;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  // ---- file handling ----
  function addFiles(files) {
    [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name))
      .forEach(f => {
        const t = { id: uid(), name: f.name, url: URL.createObjectURL(f), file: f, dur: 0 };
        tracks.push(t);
        // probe duration
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = t.url;
        probe.addEventListener('loadedmetadata', () => {
          t.dur = probe.duration;
          render();
        });
      });
    render();
  }

  function remove(i) {
    const t = tracks[i];
    URL.revokeObjectURL(t.url);
    tracks.splice(i, 1);
    if (i === current) {
      audio.pause();
      audio.removeAttribute('src');
      current = -1;
      $('title').textContent = '— 未選択 —';
      $('title').classList.add('empty');
      $('play').textContent = '▶';
    } else if (i < current) {
      current--;
    }
    render();
  }

  // ---- playback ----
  function play(i) {
    if (i < 0 || i >= tracks.length) return;
    current = i;
    const t = tracks[i];
    audio.src = t.url;
    applyRate();
    applyPitch();
    audio.play().catch(() => {});
    $('title').textContent = t.name;
    $('title').classList.remove('empty');
    updateMediaMetadata();
    render();
  }

  function updateMediaMetadata() {
    if (!('mediaSession' in navigator) || current < 0) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: tracks[current].name,
      artist: '4x Player'
    });
  }

  function applyRate() {
    const r = parseFloat($('rate').value);
    audio.playbackRate = r;
    audio.defaultPlaybackRate = r;
  }
  function applyPitch() {
    const on = $('pitch').checked;
    audio.preservesPitch = on;
    audio.mozPreservesPitch = on;
    audio.webkitPreservesPitch = on;
  }

  // ---- events: file input + drop ----
  fileIn.addEventListener('change', e => addFiles(e.target.files));
  drop.addEventListener('click', e => { /* label triggers input */ });
  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
  );
  ['dragleave','drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
  );
  drop.addEventListener('drop', e => {
    if (e.dataTransfer?.files) addFiles(e.dataTransfer.files);
  });
  // prevent the page from navigating away on stray drops
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  // ---- transport ----
  $('play').addEventListener('click', () => {
    if (current === -1 && tracks.length > 0) { play(0); return; }
    if (audio.paused) audio.play(); else audio.pause();
  });
  $('prev').addEventListener('click', () => {
    if (tracks.length === 0) return;
    play(current <= 0 ? tracks.length - 1 : current - 1);
  });
  $('next').addEventListener('click', () => {
    if (tracks.length === 0) return;
    play((current + 1) % tracks.length);
  });

  audio.addEventListener('play',  () => $('play').textContent = '⏸');
  audio.addEventListener('pause', () => $('play').textContent = '▶');
  audio.addEventListener('timeupdate', () => {
    const d = audio.duration || 0;
    const c = audio.currentTime || 0;
    $('time').textContent = `${fmt(c)} / ${fmt(d)}`;
    $('seek').value = d ? (c / d) * 100 : 0;
  });
  audio.addEventListener('loadedmetadata', () => {
    if (current >= 0 && tracks[current]) {
      tracks[current].dur = audio.duration;
      render();
    }
  });
  audio.addEventListener('ended', () => {
    if (loopMode === 1) {
      audio.currentTime = 0;
      audio.play();
    } else if (loopMode === 2) {
      play((current + 1) % tracks.length);
    } else {
      if (current < tracks.length - 1) play(current + 1);
    }
  });

  // ---- seek ----
  $('seek').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
  });

  // ---- loop toggle ----
  $('loop').addEventListener('click', () => {
    loopMode = (loopMode + 1) % 3;
    const btn = $('loop');
    btn.textContent = `LOOP: ${loopLabels[loopMode]}`;
    btn.classList.toggle('on', loopMode !== 0);
  });

  // ---- speed ----
  $('rate').addEventListener('input', e => {
    $('rateVal').textContent = parseFloat(e.target.value).toFixed(1) + '×';
    applyRate();
  });
  document.querySelectorAll('.preset').forEach(b => {
    b.addEventListener('click', () => {
      $('rate').value = b.dataset.r;
      $('rate').dispatchEvent(new Event('input'));
    });
  });
  $('pitch').addEventListener('change', applyPitch);

  // ---- keyboard ----
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.code === 'ArrowRight' && e.shiftKey) $('next').click();
    else if (e.code === 'ArrowLeft'  && e.shiftKey) $('prev').click();
    else if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
    else if (e.code === 'ArrowLeft')  audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  // initial label
  $('rateVal').textContent = parseFloat($('rate').value).toFixed(1) + '×';

  // ---- Media Session (lock screen / control center) ----
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play',          () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause',         () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => $('prev').click());
    navigator.mediaSession.setActionHandler('nexttrack',     () => $('next').click());
    audio.addEventListener('play',  () => navigator.mediaSession.playbackState = 'playing');
    audio.addEventListener('pause', () => navigator.mediaSession.playbackState = 'paused');
    audio.addEventListener('ended', () => {
      if (loopMode === 0 && current >= tracks.length - 1) {
        navigator.mediaSession.playbackState = 'none';
      }
    });
  }

  // ---- Service Worker (offline + PWA) ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
